name: Update feed

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may start it a few minutes late)
  push:
    branches: [main]
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      - name: Fetch feeds
        run: node scripts/fetch.mjs
        env:
          PREV_URL: ${{ steps.pages.outputs.base_url }}/feed.json

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html feed.json favicon.svg _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
